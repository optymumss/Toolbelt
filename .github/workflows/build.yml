name: Build

# macOS minutes count ten times against the account's GitHub Actions allowance, so each run does
# only what it needs to:
# - pull requests: build, run every test, check the DMG opens and run the real-use tests
#   (Toolbelt driven by pretend keys, mouse and trackpad; about 10 minutes);
# - main, after a merge, and "Run workflow" by hand: also the 20-minute stability test, the battery
#   check, the Chrome test and screenshots, and main attaches Toolbelt.dmg to a release (only
#   once every test has passed);
# - changes to documentation only don't start a run, and a newer push to the same branch
#   stops the older run.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      full:
        description: Also run the battery check and take screenshots
        type: boolean
        default: true

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      FULL: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    steps:
      - uses: actions/checkout@v4
      - name: Show macOS and compiler versions
        run: sw_vers && xcrun swiftc --version
      - name: Build Toolbelt.app
        run: bash build.sh
      - name: Check the Chrome extension's scripts
        run: set -e; for f in Chrome/*.js; do node --check "$f"; echo "✓ $f"; done
      - name: Run automated tests
        run: bash test.sh
      - name: Pack Toolbelt.dmg
        run: bash package.sh
      - name: Open the DMG and start the app from it
        run: bash .github/scripts/dmg.sh
      - name: Real-use tests (Toolbelt driven by pretend keys, mouse and trackpad)
        run: bash .github/scripts/real-use.sh real-use
      - name: Stability test (20 minutes of nonstop use)
        if: env.FULL == 'true'
        run: bash .github/scripts/real-use.sh stability 20
      - name: Keep the real-use results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-use-results
          path: build/*-results.txt
          if-no-files-found: ignore
      - name: Attach Toolbelt.dmg to a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" build/Toolbelt.dmg --clobber
          else
            gh release create "v$VERSION" build/Toolbelt.dmg --target "$GITHUB_SHA" --title "Toolbelt $VERSION" \
              --notes "Download Toolbelt.dmg below, open it and drag Toolbelt onto Applications. See the README for the one-time \"Open Anyway\" step."
          fi
      - name: Test the Chrome extension in Chrome
        if: env.FULL == 'true'
        run: bash .github/scripts/chrome.sh
      - name: Check battery use while idle
        if: env.FULL == 'true'
        run: bash .github/scripts/energy.sh
      - name: Launch the app and take screenshots
        if: env.FULL == 'true'
        run: bash .github/scripts/screenshots.sh
      - name: Keep screenshots
        if: always() && env.FULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && env.FULL == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          [ -d screenshots ] && [ -n "$(ls screenshots)" ] || exit 0
          SRC="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          TMP="$(mktemp -d)"
          cp screenshots/*.png "$TMP/"
          cd "$TMP"
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          printf 'Screenshots of Toolbelt from %s at %s\n' "$SRC" "$GITHUB_SHA" > README.md
          git add -A && git commit -q -m "Screenshots from $SRC ($GITHUB_SHA)"
          # Runs finishing at the same moment can race for the branch; try again a few times.
          for attempt in 1 2 3 4 5; do
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots && exit 0
            sleep $((attempt * 5))
          done
          exit 1
