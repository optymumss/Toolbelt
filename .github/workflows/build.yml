name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler version
        run: xcrun swiftc --version
      - name: Build Toolbelt.app
        run: bash build.sh
